name: Deploy Docs

# Deploy the docs together with the npm release, not on every push to main,
# so the site never documents API that is not published yet.
# `release: published` cannot be used directly: it runs on the tag ref, and the
# github-pages environment only allows deployments from main. workflow_run
# runs in the default branch context. It fires whenever the publish completes,
# so the build job below skips unless the publish succeeded.
on:
  workflow_run:
    workflows: [Publish to npm]
    types: [completed]
  # Manual redeploy (e.g. a docs-only fix). Builds the branch it is run on,
  # which must be main for the github-pages environment to accept it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The released commit for workflow_run; the run's own commit otherwise.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build docs
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
