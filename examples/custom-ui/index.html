<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibreDraw - Custom UI Example</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
      }
      #map {
        width: 100%;
        height: 100vh; /* fallback for browsers without dvh */
        height: 100dvh;
      }
      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font-size: 13px;
      }
      #panel .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      #panel button {
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid #c8c8c8;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      #panel button[aria-pressed='true'] {
        background: #285daa;
        color: #fff;
        border-color: #285daa;
      }
      #panel button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #panel input[type='number'] {
        width: 64px;
      }
      #panel [hidden] {
        display: none !important;
      }
      #log {
        max-height: 120px;
        overflow-y: auto;
        margin: 0;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <div class="row" id="modes"></div>
      <div class="row">
        <button id="input-method" type="button">Input: tap</button>
        <label>Fill <input id="fill-color" type="color" value="#285daa" /></label>
        <button id="delete" type="button">Delete</button>
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
      </div>
      <div class="row">
        <button id="finish" type="button">Finish draft</button>
        <button id="cancel" type="button">Cancel draft</button>
      </div>
      <div class="row" id="union-row" hidden>
        <button id="union-execute" type="button">Union selected</button>
      </div>
      <div class="row" id="setback-row" hidden>
        <label>Distance <input id="setback-distance" type="number" min="0.1" step="0.1" /> m</label>
        <button id="setback-execute" type="button">Set back picked edge</button>
      </div>
      <div class="row" id="rotate-row" hidden>
        <label>Angle <input id="rotate-angle" type="number" step="1" value="90" /> °</label>
        <button id="rotate-execute" type="button">Rotate</button>
      </div>
      <pre id="log"></pre>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
